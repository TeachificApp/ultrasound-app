[build]
builder = "nixpacks"
buildCommand = "pnpm install && pnpm build"
# Only pushes that touch these paths trigger a new Railway build (see RAILWAY_DEPLOY.md).
watchPatterns = [
  "client/**",
  "server/**",
  "shared/**",
  "drizzle/**",
  "package.json",
  "pnpm-lock.yaml",
  "vite.config.ts",
  "tsconfig.json",
  "railway.toml",
  "nixpacks.toml",
]

[deploy]
startCommand = "pnpm start"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[deploy.env]
NODE_ENV = "production"
AUTH_BACKEND = "local"
STORAGE_BACKEND = "r2"
