<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <title>Clearing cache…</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #0e1e2e; color: #fff; flex-direction: column; gap: 1rem; text-align: center; }
    .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { opacity: 0.7; font-size: 0.9rem; max-width: 300px; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Refreshing app…</h2>
  <p>Clearing cached files and reloading. This takes just a moment.</p>
  <script>
    (async () => {
      try {
        // Unregister all service workers
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        }
        // Clear all caches
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
      } catch (e) {
        console.warn('SW clear error:', e);
      }
      // Redirect to home with cache-busting param, then strip it
      const dest = (new URLSearchParams(location.search).get('to')) || '/';
      window.location.replace(dest + (dest.includes('?') ? '&' : '?') + '_nocache=' + Date.now());
    })();
  </script>
</body>
</html>
