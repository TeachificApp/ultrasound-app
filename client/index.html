<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>UltrasoundAssist™ — Clinical Ultrasound App</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="https://d2xsxph8kpxj0f.cloudfront.net/310519663401463434/UrcfdRVE8J6mpMNR48QuFe/aaus_logo_e47ffb71.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://d2xsxph8kpxj0f.cloudfront.net/310519663401463434/UrcfdRVE8J6mpMNR48QuFe/aaus_icon_180_teal_246d56e7.png" />
    <!-- SEO Meta -->
    <meta name="description" content="UltrasoundAssist™ by All About Ultrasound — clinical protocols, ScanCoach, Navigator, POCUS-Assist, Fetal Echo, flashcards, and case library for ultrasound professionals." />
    <meta name="keywords" content="ultrasound, sonography, POCUS, vascular ultrasound, abdominal ultrasound, obstetric ultrasound, fetal echo, breast ultrasound, MSK ultrasound, carotid duplex, TCD, ARDMS, RPVI, clinical protocols, ScanCoach, ultrasound navigator" />
    <!-- Open Graph -->
    <meta property="og:title" content="UltrasoundAssist™ — Clinical Ultrasound App" />
    <meta property="og:description" content="All About Ultrasound™ clinical companion for sonographers. Guideline-based protocols, ScanCoach, POCUS-Assist, Fetal EchoAssist, flashcards, and case library." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://d2xsxph8kpxj0f.cloudfront.net/310519663401463434/UrcfdRVE8J6mpMNR48QuFe/aaus_logo_e47ffb71.png" />
    <!-- PWA / Mobile -->
    <meta name="theme-color" content="#189aa1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UltrasoundAssist™" />
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <!-- Brand-aware meta swap (runs before React mount) -->
    <script>
      (function(){
        var h=location.hostname;
        var isIHE=h.indexOf('iheartecho')!==-1;
        var isCombo=h.indexOf('learn.')!==-1||h.indexOf('members.')!==-1||h.indexOf('member.')!==-1;
        if(!isIHE&&!isCombo) return;
        var d=document;
        function setAttr(sel,attr,val){var el=d.querySelector(sel);if(el)el.setAttribute(attr,val);}
        function setContent(sel,val){var el=d.querySelector(sel);if(el)el.setAttribute('content',val);}
        if(isIHE){
          // Canonical URL: app.iheartecho.com is the preferred domain for SEO
          var canonicalEl=d.createElement('link');canonicalEl.rel='canonical';canonicalEl.href='https://app.iheartecho.com'+location.pathname+(location.search||'');d.head.appendChild(canonicalEl);
          d.title='iHeartEcho \u2014 Echocardiography Clinical Intelligence';
          setAttr('link[rel="icon"]','href','https://d2xsxph8kpxj0f.cloudfront.net/310519663401463434/etVPnUidWNWG8W4GHnRqzv/icon-192_df958e9b.png');
          setAttr('link[rel="apple-touch-icon"]','href','https://d2xsxph8kpxj0f.cloudfront.net/310519663401463434/etVPnUidWNWG8W4GHnRqzv/icon-192_df958e9b.png');
          setContent('meta[property="og:title"]','iHeartEcho \u2014 Echocardiography Clinical Intelligence');
          setContent('meta[property="og:description"]','Real-time echo interpretation and measurement assistant for cardiac ultrasound professionals.');
          setContent('meta[property="og:image"]','https://d2xsxph8kpxj0f.cloudfront.net/310519663401463434/etVPnUidWNWG8W4GHnRqzv/icon-512_79ee0572.png');
          setContent('meta[name="description"]','iHeartEcho \u2014 Echocardiography clinical intelligence for cardiac ultrasound students, sonographers, echocardiographers, and cardiologists.');
          setContent('meta[name="apple-mobile-web-app-title"]','iHeartEcho');
          setContent('meta[name="theme-color"]','#0e1e2e');
        } else if(isCombo){
          d.title='All About Ultrasound | iHeartEcho';
          setContent('meta[property="og:title"]','All About Ultrasound | iHeartEcho');
          setContent('meta[property="og:description"]','General, Vascular & Cardiac Ultrasound Clinical Intelligence learning platform.');
          setContent('meta[name="description"]','All About Ultrasound | iHeartEcho \u2014 General, Vascular & Cardiac Ultrasound Clinical Intelligence.');
          setContent('meta[name="apple-mobile-web-app-title"]','AAUS | iHeartEcho');
        }
      })();
    </script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&family=Open+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
